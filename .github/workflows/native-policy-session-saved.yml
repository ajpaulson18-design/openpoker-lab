name: Immutable policy-session saved evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  session-packet-replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -B -m scripts.replay_native_policy_session_packet > session-saved-replay.json
      - run: python -O -B -m scripts.replay_native_policy_session_packet > session-saved-replay-optimized.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-session-saved-${{ matrix.os }}
          path: |
            session-saved-replay.json
            session-saved-replay-optimized.json
          if-no-files-found: warn
