name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        id: setup-chrome
        if: matrix.python-version == '3.13'
        with:
          chrome-version: stable
          install-chromedriver: true
      - run: python -m unittest discover -s tests -v
        env:
          OPENPOKER_REQUIRE_BROWSER_TEST: ${{ matrix.python-version == '3.13' }}
          OPENPOKER_CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          OPENPOKER_CHROMEDRIVER_BINARY: ${{ steps.setup-chrome.outputs.chromedriver-path }}
