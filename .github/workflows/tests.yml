name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests with retained diagnostics
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/unit-tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/unit-tests.log
          if-no-files-found: warn
