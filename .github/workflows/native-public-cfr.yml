name: Native public CFR
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compiled-controls:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build native public CFR executable
        shell: bash
        run: |
          python -m scripts.build_native_public --output-dir "$RUNNER_TEMP/native-public"
          echo "OPENPOKER_NATIVE_PUBLIC_EXE=$RUNNER_TEMP/native-public/native-public-train" >> "$GITHUB_ENV"
      - name: Run native public CFR controls
        run: python -m unittest tests.test_native_public_cfr tests.test_four_street_native_selection tests.test_native_four_street_benchmark tests.test_verify_native_four_street_sample -v
  sanitizer-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build AddressSanitizer and UBSan executable
        shell: bash
        run: |
          python -m scripts.build_native_public --output-dir "$RUNNER_TEMP/native-public-sanitized" --sanitize
          echo "OPENPOKER_NATIVE_PUBLIC_EXE=$RUNNER_TEMP/native-public-sanitized/native-public-train" >> "$GITHUB_ENV"
      - name: Run sanitizer controls
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python -m unittest tests.test_native_public_cfr.NativePublicCFRCompiledTests -v
