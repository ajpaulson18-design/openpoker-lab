name: Native exact lazy Catalog
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lazy-catalog:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            flags: ''
          - os: windows-latest
            label: windows
            flags: ''
          - os: ubuntu-latest
            label: sanitized
            flags: '--sanitize'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build explicit shared-owner controls
        shell: bash
        run: |
          python -B -m scripts.build_native_exact_four_street --target virtual-lazy-catalog-controls --output-dir "$RUNNER_TEMP/lazy-catalog-build" ${{ matrix.flags }}
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; else suffix=; fi
          echo "OPENPOKER_NATIVE_LAZY_CATALOG_EXE=$RUNNER_TEMP/lazy-catalog-build/native-virtual-lazy-catalog-controls$suffix" >> "$GITHUB_ENV"
          python -B - <<'PY'
          import os
          from pathlib import Path
          base = Path(os.environ['GITHUB_WORKSPACE']).resolve().parent
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for kind in ('catalog', 'joint', 'epoch'):
                  for mode in ('normal', 'optimized'):
                      output.write(f'LAZY_{kind.upper()}_{mode.upper()}_PATH={base / ("lazy-" + kind + "-" + mode)}\n')
              for mode in ('normal', 'optimized'):
                  output.write(f'THREAD_CYCLE_{mode.upper()}_PATH={base / ("thread-cycle-" + mode)}\n')
          PY
      - name: Check feasible peak states and complete native frame
        env:
          OPENPOKER_NATIVE_LAZY_CATALOG_DIR: ${{ env.LAZY_CATALOG_NORMAL_PATH }}
        run: python -B -m unittest tests.test_lazy_catalog_reference tests.test_native_lazy_catalog -v
      - name: Repeat with optimized Python
        env:
          OPENPOKER_NATIVE_LAZY_CATALOG_DIR: ${{ env.LAZY_CATALOG_OPTIMIZED_PATH }}
        run: python -O -B -m unittest tests.test_lazy_catalog_reference tests.test_native_lazy_catalog -v
      - name: Build both whole-walk storage contracts and binding guards
        shell: bash
        run: |
          python -B -m scripts.build_native_exact_four_street --target virtual-weighted-joint-single-pass-lazy --output-dir "$RUNNER_TEMP/lazy-whole-build" ${{ matrix.flags }}
          python -B -m scripts.build_native_exact_four_street --target virtual-weighted-joint-single-pass --output-dir "$RUNNER_TEMP/eager-whole-build" ${{ matrix.flags }}
          python -B -m scripts.build_native_exact_four_street --target virtual-lazy-epoch-controls --output-dir "$RUNNER_TEMP/lazy-epoch-build" ${{ matrix.flags }}
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; else suffix=; fi
          echo "OPENPOKER_NATIVE_LAZY_JOINT_EXE=$RUNNER_TEMP/lazy-whole-build/native-virtual-weighted-joint-single-pass-lazy$suffix" >> "$GITHUB_ENV"
          echo "OPENPOKER_NATIVE_LAZY_JOINT_BASELINE_EXE=$RUNNER_TEMP/eager-whole-build/native-virtual-weighted-joint-single-pass$suffix" >> "$GITHUB_ENV"
          echo "OPENPOKER_NATIVE_LAZY_EPOCH_EXE=$RUNNER_TEMP/lazy-epoch-build/native-virtual-lazy-epoch-controls$suffix" >> "$GITHUB_ENV"
      - name: Check twelve whole-walk witnesses against independent arithmetic and storage
        env:
          OPENPOKER_NATIVE_LAZY_JOINT_DIR: ${{ env.LAZY_JOINT_NORMAL_PATH }}
          OPENPOKER_NATIVE_LAZY_EPOCH_DIR: ${{ env.LAZY_EPOCH_NORMAL_PATH }}
        run: python -B -m unittest tests.test_lazy_joint_forecast tests.test_native_lazy_joint -v
      - name: Repeat complete whole-walk checks with optimized Python
        env:
          OPENPOKER_NATIVE_LAZY_JOINT_DIR: ${{ env.LAZY_JOINT_OPTIMIZED_PATH }}
          OPENPOKER_NATIVE_LAZY_EPOCH_DIR: ${{ env.LAZY_EPOCH_OPTIMIZED_PATH }}
        run: python -O -B -m unittest tests.test_lazy_joint_forecast tests.test_native_lazy_joint -v
      - name: Build own-thread counter capability probe on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -B -m scripts.build_native_exact_four_street --target current-thread-cycle-probe --output-dir "$RUNNER_TEMP/thread-cycle-build"
          echo "OPENPOKER_NATIVE_THREAD_CYCLE_EXE=$RUNNER_TEMP/thread-cycle-build/native-current-thread-cycle-probe.exe" >> "$GITHUB_ENV"
      - name: Observe own-thread counter without constructing a solver
        if: runner.os == 'Windows'
        env:
          OPENPOKER_NATIVE_THREAD_CYCLE_DIR: ${{ env.THREAD_CYCLE_NORMAL_PATH }}
        run: python -B -m unittest tests.test_native_thread_cycles -v
      - name: Repeat counter observation with optimized Python
        if: runner.os == 'Windows'
        env:
          OPENPOKER_NATIVE_THREAD_CYCLE_DIR: ${{ env.THREAD_CYCLE_OPTIMIZED_PATH }}
        run: python -O -B -m unittest tests.test_native_thread_cycles -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-lazy-catalog-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/lazy-catalog-build/*.log
            ${{ runner.temp }}/lazy-catalog-build/*.json
            ${{ runner.temp }}/lazy-whole-build/*.log
            ${{ runner.temp }}/lazy-whole-build/*.json
            ${{ runner.temp }}/eager-whole-build/*.log
            ${{ runner.temp }}/eager-whole-build/*.json
            ${{ runner.temp }}/lazy-epoch-build/*.log
            ${{ runner.temp }}/lazy-epoch-build/*.json
            ${{ runner.temp }}/thread-cycle-build/*.log
            ${{ runner.temp }}/thread-cycle-build/*.json
            ${{ env.LAZY_CATALOG_NORMAL_PATH }}/**
            ${{ env.LAZY_CATALOG_OPTIMIZED_PATH }}/**
            ${{ env.LAZY_JOINT_NORMAL_PATH }}/**
            ${{ env.LAZY_JOINT_OPTIMIZED_PATH }}/**
            ${{ env.LAZY_EPOCH_NORMAL_PATH }}/**
            ${{ env.LAZY_EPOCH_OPTIMIZED_PATH }}/**
            ${{ env.THREAD_CYCLE_NORMAL_PATH }}/**
            ${{ env.THREAD_CYCLE_OPTIMIZED_PATH }}/**
          if-no-files-found: warn
