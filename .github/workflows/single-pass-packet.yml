name: Single pass saved evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  saved-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Replay primary rows and every timing observation without native execution
        shell: bash
        run: |
          python -B -m scripts.replay_single_pass_packet > "$RUNNER_TEMP/single-pass-replay-normal.json"
          python -O -B -m scripts.replay_single_pass_packet > "$RUNNER_TEMP/single-pass-replay-optimized.json"
      - name: Refuse corrupted evidence before numerical imports
        run: python -B -m unittest tests.test_single_pass_packet_admission -v
      - name: Check independent lifetime worksheet
        run: python -B -m unittest tests.test_joint_learning_lifetime -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-pass-saved-replay-${{ matrix.os }}
          path: ${{ runner.temp }}/single-pass-replay-*.json
          if-no-files-found: warn
