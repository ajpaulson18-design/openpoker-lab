name: Native experimental training regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  study-training:
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tag: windows
            sanitize: ''
          - os: ubuntu-latest
            tag: linux
            sanitize: ''
          - os: ubuntu-latest
            tag: sanitized
            sanitize: --sanitize
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select installed MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Check observation failure guards
        shell: bash
        run: python -B -O -m unittest tests.test_native_training_study_checks -v
      - name: Build every explicit study target
        shell: bash
        run: |
          for target in virtual-dyadic-training virtual-dyadic-training-staged-pages virtual-dyadic-training-terminal-buffer virtual-dyadic-training-allin-reach virtual-dyadic-training-mixed-policy-cache virtual-dyadic-training-factored-average; do
            if ! python -B -m scripts.build_native_exact_four_street --target "$target" --output-dir "$RUNNER_TEMP/training-studies/builds/$target" ${{ matrix.sanitize }}; then
              cat "$RUNNER_TEMP/training-studies/builds/$target/build.log"
              exit 1
            fi
          done
      - name: Verify six complete training calls against preserved evidence
        shell: bash
        run: |
          python -B -O -m scripts.check_native_training_studies --builds "$RUNNER_TEMP/training-studies/builds" --output "$RUNNER_TEMP/training-studies/captures"
      - name: Preserve identities and first failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-training-studies-${{ matrix.tag }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/training-studies/**/*.json
            ${{ runner.temp }}/training-studies/**/*.log
            ${{ runner.temp }}/training-studies/captures/**/stdout.bin
            ${{ runner.temp }}/training-studies/captures/**/stderr.bin
