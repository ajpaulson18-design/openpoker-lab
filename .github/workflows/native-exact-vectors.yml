name: Native exact selected vectors
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compiled-vectors:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select installed MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build exact vector conformance helper
        shell: bash
        run: |
          python -m scripts.build_native_exact_four_street --target kernel --output-dir "$RUNNER_TEMP/native-exact-vectors"
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=.exe; else suffix=; fi
          echo "OPENPOKER_NATIVE_EXACT_SELECTED_VECTORS_EXE=$RUNNER_TEMP/native-exact-vectors/native-exact-selected-vectors$suffix" >> "$GITHUB_ENV"
      - name: Physical Fraction and independent best-five controls
        run: python -O -m unittest tests.test_native_exact_selected_vectors -v
      - name: Preserve first build and failure records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-exact-vectors-${{ runner.os }}
          path: |
            ${{ runner.temp }}/native-exact-vectors/*.log
            ${{ runner.temp }}/native-exact-vectors/*.json
  sanitized-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build ASan and UBSan exact vector helper
        shell: bash
        run: |
          python -m scripts.build_native_exact_four_street --target kernel --output-dir "$RUNNER_TEMP/native-exact-vectors-sanitized" --sanitize
          echo "OPENPOKER_NATIVE_EXACT_SELECTED_VECTORS_EXE=$RUNNER_TEMP/native-exact-vectors-sanitized/native-exact-selected-vectors" >> "$GITHUB_ENV"
      - name: Required sanitized physical controls
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python -m unittest tests.test_native_exact_selected_vectors -v
      - name: Preserve first build and failure records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-exact-vectors-sanitized
          path: |
            ${{ runner.temp }}/native-exact-vectors-sanitized/*.log
            ${{ runner.temp }}/native-exact-vectors-sanitized/*.json
