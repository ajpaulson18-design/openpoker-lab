name: Native compact persistent role Store
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compact-storage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            flags: ''
          - os: windows-latest
            label: windows
            flags: ''
          - os: ubuntu-latest
            label: sanitized
            flags: '--sanitize'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Admit original state and timing sources before current exact replay
        shell: bash
        run: |
          python -B -m scripts.replay_compact_role_storage > "$RUNNER_TEMP/compact-storage-replay-normal.json"
          python -O -B -m scripts.replay_compact_role_storage > "$RUNNER_TEMP/compact-storage-replay-optimized.json"
          python -B -m scripts.replay_compact_role_cost > "$RUNNER_TEMP/compact-storage-cost-normal.json"
          python -O -B -m scripts.replay_compact_role_cost > "$RUNNER_TEMP/compact-storage-cost-optimized.json"
          python -B -m scripts.replay_role_row_depth > "$RUNNER_TEMP/compact-row-depth-normal.json"
          python -O -B -m scripts.replay_role_row_depth > "$RUNNER_TEMP/compact-row-depth-optimized.json"
          python -B -m scripts.replay_role_training_frontier > "$RUNNER_TEMP/compact-storage-frontier-normal.json"
          python -O -B -m scripts.replay_role_training_frontier > "$RUNNER_TEMP/compact-storage-frontier-optimized.json"
          python -B -m unittest tests.test_compact_role_storage_admission tests.test_compact_role_storage_packet_admission tests.test_compact_role_cost_packet_admission -v
          python -B -m unittest tests.test_role_row_depth_reference tests.test_role_row_depth_packet_admission -v
          python -B -m unittest tests.test_role_training_frontier tests.test_role_training_frontier_packet -v
      - name: Build explicit same-Store variants and untouched default protocol
        shell: bash
        run: |
          python -B -m scripts.build_compact_role_storage --target role-storage-canonical --output-dir "$RUNNER_TEMP/compact-canonical-build" ${{ matrix.flags }}
          python -B -m scripts.build_compact_role_storage --target role-storage-compact --output-dir "$RUNNER_TEMP/compact-compact-build" ${{ matrix.flags }}
          python -B -m scripts.build_compact_role_storage --target role-storage-controls --output-dir "$RUNNER_TEMP/compact-controls-build" ${{ matrix.flags }}
          python -B -m scripts.build_frozen_role_walk --target opponent-role-four-street --output-dir "$RUNNER_TEMP/compact-default-build" ${{ matrix.flags }}
      - name: Execute both full exact-policy matrices and historical-default byte comparisons
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; else suffix=; fi
          python -B -m scripts.run_compact_role_storage_matrix "$RUNNER_TEMP/compact-canonical-build/native-role-storage-canonical$suffix" "$RUNNER_TEMP/compact-compact-build/native-role-storage-compact$suffix" "$RUNNER_TEMP/compact-controls-build/native-role-storage-controls$suffix" "$RUNNER_TEMP/compact-default-build/native-opponent-role-four-street$suffix" ../compact-storage-normal > "$RUNNER_TEMP/compact-storage-fresh-normal.jsonl"
          python -O -B -m scripts.run_compact_role_storage_matrix "$RUNNER_TEMP/compact-canonical-build/native-role-storage-canonical$suffix" "$RUNNER_TEMP/compact-compact-build/native-role-storage-compact$suffix" "$RUNNER_TEMP/compact-controls-build/native-role-storage-controls$suffix" "$RUNNER_TEMP/compact-default-build/native-opponent-role-four-street$suffix" ../compact-storage-optimized > "$RUNNER_TEMP/compact-storage-fresh-optimized.jsonl"
          python -B - <<'PY'
          from pathlib import Path
          from scripts.run_frozen_role_walk_matrix import cases
          root=Path.cwd().parent
          for label,_,_,_ in cases():
              first=root/('compact-storage-normal-'+label)
              second=root/('compact-storage-optimized-'+label)
              for name in ('default/stdout.bin','canonical/stdout.bin','compact/stdout.bin','controls/stdout.bin','request.bin'):
                  if (first/name).read_bytes()!=(second/name).read_bytes():
                      raise ValueError('compact storage paired-mode wire differs: '+label+'/'+name)
          PY
      - name: Stage complete original source, controls and process evidence
        if: always()
        shell: python
        run: |
          import os,shutil
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP']);out=temp/'compact-storage-evidence';out.mkdir(exist_ok=True)
          root=Path.cwd().parent
          for source in root.glob('compact-storage-*-profile-*'):
              if source.is_dir():shutil.copytree(source,out/source.name)
          for name in ('compact-canonical-build','compact-compact-build','compact-controls-build','compact-default-build'):
              source=temp/name
              if source.is_dir():
                  target=out/name;target.mkdir()
                  for member in ('source-identity.json','build.log','build-failure.json','compiler-version.log','native-exact-build-manifest.json'):
                      if (source/member).is_file():shutil.copyfile(source/member,target/member)
                  if (source/'source').is_dir():shutil.copytree(source/'source',target/'source')
          for pattern in ('compact-storage-*.json','compact-storage-*.jsonl','compact-row-depth-*.json'):
              for path in temp.glob(pattern):shutil.copyfile(path,out/path.name)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-persistent-role-store-${{ matrix.label }}
          path: ${{ runner.temp }}/compact-storage-evidence
          if-no-files-found: warn
