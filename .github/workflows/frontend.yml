name: Frontend contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check pokerlab/web/app.js
      - run: node scripts/test_frontend.cjs
