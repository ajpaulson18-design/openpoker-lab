name: Sparse strategy catalog immutable packet replay
on: [push, pull_request]
permissions:
  contents: read
jobs:
  catalog-packet-replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Replay immutable packets normally
        run: python -B -m scripts.replay_strategy_catalog_packet > sparse-catalog-packet-replay.json
      - name: Replay immutable packets with optimized Python
        run: python -O -B -m scripts.replay_strategy_catalog_packet > sparse-catalog-packet-replay-optimized.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sparse-catalog-packet-${{ matrix.os }}
          path: |
            sparse-catalog-packet-replay.json
            sparse-catalog-packet-replay-optimized.json
          if-no-files-found: warn
