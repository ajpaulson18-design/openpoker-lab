name: Native history compiler diagnostic
on:
  push:
    branches:
      - foundation/history-control-call-boundary
    paths:
      - .github/workflows/history-compiler-diagnostic.yml
      - scripts/diagnose_native_history_compiler.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: history-compiler-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compiler-phases:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select installed MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
      - name: Capture bounded non-linking compiler phases
        shell: pwsh
        run: python -B -m scripts.diagnose_native_history_compiler --output-dir "$env:RUNNER_TEMP\history-compiler-diagnostic"
      - name: Preserve compiler and phase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-history-compiler-diagnostic
          path: ${{ runner.temp }}/history-compiler-diagnostic/**
