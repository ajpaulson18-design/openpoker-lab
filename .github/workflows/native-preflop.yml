name: Native preflop conformance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OPENPOKER_NATIVE_BUILD_DIR: build/native-preflop-ci
      OPENPOKER_NATIVE_EQUITY_BUILD_DIR: build/native-preflop-ci
      OPENPOKER_NATIVE_TRAIN_BUILD_DIR: ../native-train-flop-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build with installed C compiler
        if: runner.os != 'Windows'
        run: |
          python -m scripts.build_native_preflop --output-dir "$OPENPOKER_NATIVE_BUILD_DIR"
          python -m scripts.build_native_train --output-dir "$OPENPOKER_NATIVE_TRAIN_BUILD_DIR"
      - name: Build with installed MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswherePath = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswherePath -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstall) { throw 'Installed MSVC toolchain unavailable' }
          $nativeDevCmd = Join-Path $vsInstall 'Common7\Tools\VsDevCmd.bat'
          $nativeEnvironment = & cmd.exe /d /c "call `"$nativeDevCmd`" -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($environmentLine in $nativeEnvironment) {
            if ($environmentLine -match '^([^=]+)=(.*)$') {
              [System.Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
            }
          }
          python -m scripts.build_native_preflop --output-dir "$env:OPENPOKER_NATIVE_BUILD_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.build_native_train --output-dir "$env:OPENPOKER_NATIVE_TRAIN_BUILD_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Independent rank, full-board count and protocol conformance
        run: python -m unittest tests.test_native_preflop_protocol tests.test_native_preflop_equity tests.test_native_flop_equity tests.test_benchmark_native_flop_preparation -v
