[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openpoker-lab"
version = "0.2.0"
description = "Open-source poker simulation, opponent modeling, and river strategy research"
requires-python = ">=3.11"
dependencies = []
license = {text = "MIT"}

[project.scripts]
openpoker = "pokerlab.server:main"

[tool.setuptools.package-data]
pokerlab = ["web/*"]
